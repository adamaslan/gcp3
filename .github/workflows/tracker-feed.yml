name: Industry tracker feed

# Second, independent feed for the industry tracker. Runs backend/feed_tracker.py
# in the runner and writes straight to Firestore, so it keeps working when the
# Cloud Run backend is down (billing outage 2026-09-08) and covers a Cloud
# Scheduler miss. The Modal feed (deploy/modal/tracker_feed.py) is the third.
#
# Staggered against the others so a broken vendor day is not hit three times
# at once:
#   Cloud Scheduler  22:00 UTC   gcp3-etf-seed-daily
#   GitHub Actions   23:00 UTC   this file
#   Modal            23:30 UTC   deploy/modal/tracker_feed.py
# 23:00 UTC is 19:00 ET in summer and 18:00 ET in winter, past the settle margin
# in both. GitHub cron is UTC-only, so the worse season sets the time.
on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:
    inputs:
      checkOnly:
        description: 'Report freshness only, write nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: tracker-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check credentials are present
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "${GCP_SA_KEY}" ]; then
            echo "::error::GCP_SA_KEY is not set. See docs/gcp3-industry-tracker-status.md (TODO 7) for the copy-paste setup."
            exit 1
          fi

      - name: Feed the tracker
        working-directory: backend
        env:
          GCP_PROJECT_ID: ttb-lang1
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          IN_CHECK_ONLY: ${{ github.event.inputs.checkOnly }}
        run: |
          set -euo pipefail
          # The key goes to a runner-local file and is never echoed.
          umask 077
          printf '%s' "${GCP_SA_KEY}" > "${RUNNER_TEMP}/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/sa.json"
          args=()
          [ "${IN_CHECK_ONLY}" = "true" ] && args+=("--check-only")
          python feed_tracker.py "${args[@]}"

      - name: Remove credentials file
        if: always()
        run: rm -f "${RUNNER_TEMP}/sa.json"

      - name: Open or update the tracker-feed failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'tracker-feed-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 1,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Another failed run: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Industry tracker feed is failing or stale',
                body: `The GitHub Actions feed failed or found etf_history stale.\n\n- run: ${runUrl}\n\nSee docs/gcp3-industry-tracker-status.md. Close this issue once a run is green.`,
                labels: [label],
              });
            }
